<!doctype html>
<!-- Source for social-preview.png (1280 x 640). Render with a headless browser at that window size. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>wellasked social preview</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body { background: #ffffff; color: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; display: grid; grid-template-columns: 660px 1fr; border-top: 8px solid #0969da; }
  .left { padding: 56px 0 48px 64px; display: flex; flex-direction: column; }
  .repo { font-size: 20px; color: #59636e; margin-bottom: 14px; }
  h1 { font-size: 84px; font-weight: 700; letter-spacing: -1px; line-height: 1; margin-bottom: 18px; }
  .tag { font-size: 30px; color: #3d444d; margin-bottom: 40px; }
  .group { margin-bottom: 18px; }
  .group .label { font-size: 16px; font-weight: 600; color: #59636e; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip { font-size: 19px; font-weight: 600; color: #0969da; border: 1.5px solid #0969da; border-radius: 6px; padding: 6px 11px; background: #fff; }
  .install { margin-top: auto; display: inline-flex; align-self: flex-start; align-items: center; gap: 12px; background: #1f2328; color: #e6edf3; border-radius: 8px; padding: 14px 20px; font: 20px ui-monospace, SFMono-Regular, Consolas, monospace; }
  .install span { color: #8b949e; }
  .right { background: #f6f8fa; border-left: 1px solid #d0d7de; padding: 36px 40px; display: flex; flex-direction: column; justify-content: center; gap: 18px; }
  figure { position: relative; border: 1px solid #d0d7de; border-radius: 8px; overflow: hidden; background: #fff; height: 262px; }
  figure img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  figcaption { position: absolute; left: 12px; top: 12px; font-size: 16px; font-weight: 600; padding: 4px 10px; border-radius: 6px; background: #ffffff; color: #1f2328; border: 1px solid #d0d7de; }
</style>
</head>
<body>
  <div class="left">
    <div class="repo">github.com/shashikantdev3/wellasked</div>
    <h1>wellasked</h1>
    <div class="tag">Agent skills that remove the guessing.</div>
    <div class="group">
      <div class="label">Prompts</div>
      <div class="chips"><span class="chip">wellasked</span><span class="chip">prompt-review</span><span class="chip">prompt-evals</span><span class="chip">prompt-port</span></div>
    </div>
    <div class="group">
      <div class="label">Agents and UI</div>
      <div class="chips"><span class="chip">agent-gates</span><span class="chip">enterprise-ui</span></div>
    </div>
    <div class="install"><span>$</span>npx skills add shashikantdev3/wellasked</div>
  </div>
  <div class="right">
    <figure><img src="../examples/enterprise-ui/before.png" alt=""><figcaption>Before</figcaption></figure>
    <figure><img src="../examples/enterprise-ui/after.png" alt=""><figcaption>After, with enterprise-ui</figcaption></figure>
  </div>
</body>
</html>
